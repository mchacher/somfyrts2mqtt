; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-mini

[env:esp32-c3-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
; Libs added as features are wired up:
;   knolleary/PubSubClient            - MQTT client (when we add the bridge)
;   bblanchon/ArduinoJson             - JSON payloads on MQTT
;   esp32async/AsyncTCP               - required by ESPAsyncWebServer
;   esp32async/ESPAsyncWebServer      - pairing web UI
lib_deps =
	https://github.com/Legion2/Somfy_Remote_Lib.git
	https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
