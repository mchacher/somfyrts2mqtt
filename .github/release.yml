# Auto-generated release notes config for `generate_release_notes: true`.
# GitHub groups PRs into the categories below based on their labels ;
# everything not matched lands in "Other changes".
#
# Add labels to PRs as part of the merge workflow so the body of each
# release is structured. Reference :
#   https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies   # dependabot noise stays out of the release body
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
        - feat
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
    - title: 📚 Documentation
      labels:
        - docs
        - documentation
    - title: 🔧 CI / build
      labels:
        - ci
        - build
    - title: ♻️ Refactor / chore
      labels:
        - refactor
        - chore
    - title: 🧪 Tests
      labels:
        - test
        - tests
    - title: Other changes
      labels:
        - "*"
