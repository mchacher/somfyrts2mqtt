; PlatformIO Project Configuration File
; somfyrts2mqtt - ESP32-C3 + CC1101 bridge for Somfy RTS over MQTT.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-mini

; --- Shared build flags ---
[common]
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -Wall

; --- Firmware (target: ESP32-C3 Super Mini) ---
[env:esp32-c3-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Static analysis: cppcheck via `pio check`.
check_tool = cppcheck
check_severity = high, medium
check_skip_packages = yes
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem

; Libraries (added as features are wired up):
;   knolleary/PubSubClient        - MQTT client (when we wire the bridge)
;   bblanchon/ArduinoJson         - JSON payloads on MQTT
;   esp32async/AsyncTCP           - required by ESPAsyncWebServer
;   esp32async/ESPAsyncWebServer  - pairing web UI
lib_deps =
    https://github.com/Legion2/Somfy_Remote_Lib.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git

test_ignore = test_*

; --- Native env for unit tests (runs on dev host, no hardware) ---
[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -std=gnu++17
test_framework = unity
