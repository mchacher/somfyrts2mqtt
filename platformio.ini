; PlatformIO Project Configuration File
; somfyrts2mqtt - ESP32 + CC1101 bridge for Somfy RTS over MQTT.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-mini

; --- Shared build flags ---
[common]
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -Wall

; --- Firmware base shared by every hardware env ---
[firmware_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DASYNCWEBSERVER_REGEX

; Static analysis: cppcheck via `pio check`. Project sources only —
; third-party libs (lib_deps under .pio/libdeps) are out of scope.
check_tool = cppcheck
check_severity = high, medium
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --suppress=*:*/.pio/libdeps/*

lib_deps =
    https://github.com/Legion2/Somfy_Remote_Lib.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    esp32async/AsyncTCP@^3.4.9
    esp32async/ESPAsyncWebServer@^3.11.0

test_ignore = test_*

; --- ESP32-C3 Super Mini (RISC-V, native USB-CDC) ---
[env:esp32-c3-mini]
extends = firmware_base
board = esp32-c3-devkitm-1
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32 WROOM (NodeMCU-32S / DevKit-32) ---
[env:esp32-wroom]
extends = firmware_base
board = esp32dev

; --- Native env for unit tests (runs on dev host, no hardware) ---
[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -std=gnu++17
test_framework = unity
